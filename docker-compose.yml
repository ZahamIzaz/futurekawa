services:

  # ─────────────────────────────────────────────
  # Base de données PostgreSQL (backend pays)
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: futurekawa_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - futurekawa_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Broker MQTT Eclipse Mosquitto
  # ─────────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: futurekawa_mosquitto
    ports:
      - "${MQTT_PORT}:1883"
    volumes:
      - ./infrastructure/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - futurekawa_net
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Backend central siège – agrégateur REST
  # ─────────────────────────────────────────────
  backend-central:
    build:
      context: ./backend-central
      dockerfile: Dockerfile
    container_name: futurekawa_backend_central
    environment:
      PORT: 3000
      BRAZIL_BACKEND_URL: http://backend-country:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend-country
    networks:
      - futurekawa_net
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Backend pays (Brésil) – API REST + consumer MQTT
  # ─────────────────────────────────────────────
  backend-country:
    build:
      context: ./backend-country
      dockerfile: Dockerfile
    container_name: futurekawa_backend_country
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MQTT_BROKER_URL: mqtt://mosquitto:1883
      PORT: 3001
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      MAIL_FROM: alerts@futurekawa.local
      BRAZIL_MANAGER_EMAIL: responsable.bresil@futurekawa.local
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    networks:
      - futurekawa_net
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Simulateur IoT – publie des mesures MQTT
  # ─────────────────────────────────────────────
  iot-simulator:
    build:
      context: ./iot/simulator
      dockerfile: Dockerfile
    container_name: futurekawa_iot_simulator
    environment:
      MQTT_BROKER_URL: mqtt://mosquitto:1883
      INTERVAL_MS: 10000
    depends_on:
      - mosquitto
    networks:
      - futurekawa_net
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Frontend Web – interface React/Vite (nginx)
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:3000
    container_name: futurekawa_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend-central
    networks:
      - futurekawa_net
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # MailHog – serveur SMTP de test
  # ─────────────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: futurekawa_mailhog
    ports:
      - "${MAILHOG_SMTP_PORT}:1025"   # SMTP
      - "${MAILHOG_UI_PORT}:8025"     # Interface Web
    networks:
      - futurekawa_net
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Jenkins CI/CD (profil : ci)
  #
  # Démarrer Jenkins uniquement :
  #   docker compose --profile ci up -d jenkins
  #
  # ⚠ Le montage /var/run/docker.sock donne à Jenkins
  #   un accès complet au Docker Engine de l'hôte.
  #   Acceptable en démonstration locale uniquement.
  # ─────────────────────────────────────────────
  jenkins:
    build:
      context: ./infrastructure/jenkins
      dockerfile: Dockerfile
    container_name: futurekawa_jenkins
    profiles:
      - ci
    ports:
      - "8080:8080"     # Interface Web Jenkins
      - "50000:50000"   # Port agents JNLP (si nécessaire)
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - futurekawa_net
    restart: unless-stopped

# ─────────────────────────────────────────────
# Volumes nommés (persistance des données)
# ─────────────────────────────────────────────
volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:
  jenkins_home:

# ─────────────────────────────────────────────
# Réseau interne partagé entre les services
# ─────────────────────────────────────────────
networks:
  futurekawa_net:
    driver: bridge
