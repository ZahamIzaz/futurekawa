# ──────────────────────────────────────────────
# Mosquitto – configuration minimale locale
# ──────────────────────────────────────────────

# Écoute sur le port MQTT standard
listener 1883

# Accès anonyme autorisé (environnement de développement local)
allow_anonymous true

# Persistance des messages sur le volume monté
persistence true
persistence_location /mosquitto/data/

# Logs vers fichier et stdout (visibles via docker compose logs)
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all
